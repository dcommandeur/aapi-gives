<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPI Gives - For the Balance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5rem;
            margin-bottom: 3rem;
            font-style: italic;
            animation: fadeIn 1.5s ease-in;
        }

        .scale-container {
            position: relative;
            width: 600px;
            height: 400px;
            animation: fadeIn 2s ease-in;
        }

        /* Scale stand */
        .stand {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 200px;
            background: linear-gradient(to bottom, #8B7355, #654321);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .base {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 40px;
            background: linear-gradient(to bottom, #654321, #4a2f1a);
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        /* Balance beam */
        .beam {
            position: absolute;
            top: 100px;
            left: 50%;
            transform-origin: center center;
            width: 500px;
            height: 10px;
            background: linear-gradient(to bottom, #C0C0C0, #808080);
            border-radius: 5px;
            margin-left: -250px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            animation: tilt 4s ease-in-out infinite;
        }

        /* Scale plates */
        .plate {
            position: absolute;
            width: 120px;
            height: 15px;
            background: linear-gradient(to bottom, #FFD700, #DAA520);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .plate-left {
            left: 0;
            top: 0;
        }

        .plate-right {
            right: 0;
            top: 0;
        }

        /* Chains */
        .chain {
            position: absolute;
            width: 3px;
            height: 60px;
            background: repeating-linear-gradient(
                to bottom,
                #888 0px,
                #888 5px,
                transparent 5px,
                transparent 10px
            );
        }

        .chain-left-1 {
            left: 30px;
            top: -60px;
        }

        .chain-left-2 {
            left: 90px;
            top: -60px;
        }

        .chain-right-1 {
            right: 30px;
            top: -60px;
        }

        .chain-right-2 {
            right: 90px;
            top: -60px;
        }

        /* Content on plates */
        .content {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .left-content {
            left: 0;
            animation: float 3s ease-in-out infinite;
        }

        .left-content .symbols {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .alpha {
            color: #FFD700;
            font-size: 4rem;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .omega {
            color: #FF6B6B;
            font-size: 4rem;
            filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.5));
        }

        .right-content {
            right: 0;
            animation: float 3s ease-in-out infinite 0.5s;
        }

        .sign {
            color: #4ECDC4;
            font-size: 4.5rem;
            filter: drop-shadow(0 0 10px rgba(78, 205, 196, 0.5));
        }

        .label {
            font-size: 0.9rem;
            color: white;
            margin-top: 10px;
            font-style: italic;
            opacity: 0.9;
        }

        /* Animations */
        @keyframes tilt {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-3deg);
            }
            75% {
                transform: rotate(3deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Fulcrum/pivot point */
        .fulcrum {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 20px solid #654321;
            z-index: 1;
        }

        /* Decorative sparkles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 2s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 50px; left: 100px; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 80px; right: 150px; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { top: 120px; left: 200px; animation-delay: 1s; }
        .sparkle:nth-child(4) { top: 60px; right: 80px; animation-delay: 1.5s; }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>AAPI Gives</h1>
    <p class="subtitle">For the Balance</p>
    
    <div class="scale-container">
        <!-- Decorative sparkles -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        
        <!-- Scale stand and base -->
        <div class="base"></div>
        <div class="stand"></div>
        <div class="fulcrum"></div>
        
        <!-- Balance beam with plates -->
        <div class="beam">
            <!-- Left chain and plate -->
            <div class="chain chain-left-1"></div>
            <div class="chain chain-left-2"></div>
            <div class="plate plate-left"></div>
            
            <!-- Right chain and plate -->
            <div class="chain chain-right-1"></div>
            <div class="chain chain-right-2"></div>
            <div class="plate plate-right"></div>
        </div>
        
        <!-- Content on left plate -->
        <div class="content left-content">
            <div class="symbols">
                <span class="alpha">Α</span>
                <span class="omega">Ω</span>
            </div>
            <div class="label">Alpha & Omega</div>
        </div>
        
        <!-- Content on right plate -->
        <div class="content right-content">
            <span class="sign">☯</span>
            <div class="label">Balance</div>
        </div>
    </div>
</body>
</html>
