<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D|Enterprise - Scales (3D)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1d1e18; }
        canvas { display: block; }
    </style>
    <!-- Layer 4: The Engine -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <!-- Layer 3: The Stage -->
    <script type="module">
        import * as THREE from 'three';

        // 1. Scene Setup (Layer 1)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1d1e18);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        camera.position.y = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 2. The Scales (Layer 4 Components)
        const materialBlack = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const materialGreen = new THREE.MeshStandardMaterial({ color: 0x09a322 });
        const materialRed = new THREE.MeshStandardMaterial({ color: 0x972a2a });
        const materialChain = new THREE.MeshBasicMaterial({ color: 0x555555 });

        // Helper for Rounded Boxes
        function createRoundedBox(width, height, depth, radius, material) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            // Note: Three.js BoxGeometry doesn't support rounding natively in this version without modifiers.
            // We will switch to a Capsule or Cylinder for the vertical, and a custom shape or just high-segment box for now?
            // Actually, let's use a trick: A very thin Cylinder for the vertical, or just accept that "RoundedBoxGeometry" is an external plugin.
            // For standard Three.js without plugins, we can use Cylinders for the bars to make them "smooth" or just use a high-poly approach.
            // Let's try using Cylinders for the bars instead of Boxes - they are naturally round.
            
            // If the user specifically wants "Rounded Rectangles" (like an iPhone edge), we need a different geometry.
            // But "Smooth" usually means "No sharp corners". Cylinders are the best native primitive for this.
            return new THREE.Mesh(new THREE.CylinderGeometry(width/2, width/2, height, 32), material);
        }

        // Topbar (Vertical Stand) - Now a Cylinder
        const topbar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4, 32), materialBlack);
        scene.add(topbar);

        // Bottom Bar (Base) - Rounded Rectangle (Box with bevel)
        // Since we want "smooth edges" but a "rectangle shape", we can use a BoxGeometry but we can't easily bevel it without external loaders.
        // However, we can simulate it by scaling a Cylinder or just using a Box for now if the user wants the SHAPE back.
        // Let's revert to BoxGeometry but maybe add a small bevel if possible? 
        // Standard BoxGeometry doesn't bevel. Let's just go back to BoxGeometry as requested.
        const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 1), materialBlack);
        bottomBar.position.y = -2;
        scene.add(bottomBar);

        // Weighbar (Crossbeam) - Now a Cylinder rotated 90 degrees
        // Adjusted length to 3.1 to minimize overhang past the bakkies (at +/- 1.5)
        const weighbar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.1, 32), materialBlack);
        weighbar.rotation.z = Math.PI / 2;
        weighbar.position.y = 1.5;
        scene.add(weighbar);

        // The Pivot Joint (Axel/Circle)
        // This connects the Topbar (Mast) and the Weighbar (Arm)
        // Gold color, smaller radius (0.08) to fit inside the beam (0.1 radius) with spacing
        const materialGold = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });
        const pivotGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.3, 32);
        const pivotJoint = new THREE.Mesh(pivotGeo, materialGold);
        pivotJoint.rotation.x = Math.PI / 2; // Rotate to face forward like a wheel/axel
        pivotJoint.position.y = 1.5; // Same height as weighbar
        scene.add(pivotJoint);

        // Chains & Bakkies (Complex Suspension)
        function createSuspendedBakkie(xPos, color) {
            const group = new THREE.Group();

            // 1. The Bakkie (Cup -> Platter -> Rounded Square)
            // Scaled up to 1.2 as requested
            // To get "Rounded Corners" on a Box in Three.js without external loaders, we can use a trick:
            // Create a shape with rounded corners and extrude it.
            const shape = new THREE.Shape();
            const w = 1.2, h = 1.2, r = 0.2; // Width, Height, Radius
            const x = -w/2, y = -h/2;
            
            shape.moveTo(x + r, y);
            shape.lineTo(x + w - r, y);
            shape.quadraticCurveTo(x + w, y, x + w, y + r);
            shape.lineTo(x + w, y + h - r);
            shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            shape.lineTo(x + r, y + h);
            shape.quadraticCurveTo(x, y + h, x, y + h - r);
            shape.lineTo(x, y + r);
            shape.quadraticCurveTo(x, y, x + r, y);

            const extrudeSettings = { depth: 0.1, bevelEnabled: false };
            const bakkieGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            
            // Rotate to lay flat (Extrude creates along Z, we want Y up)
            const bakkieMat = new THREE.MeshStandardMaterial({ color: color });
            const bakkie = new THREE.Mesh(bakkieGeo, bakkieMat);
            bakkie.rotation.x = Math.PI / 2; 
            bakkie.position.set(xPos, -0.5, 0.05); // Adjust Y to match previous center
            // Note: Extrude geometry origin is bottom-left, so we need to center it manually or via geometry.center()
            bakkieGeo.center(); 
            
            group.add(bakkie);

            // 2. The Bolt (Gold Hinge at connection point)
            // Size <= 2/3 of main pivot (0.08 * 0.66 = ~0.053)
            const boltGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 32);
            const bolt = new THREE.Mesh(boltGeo, materialGold);
            bolt.rotation.x = Math.PI / 2;
            bolt.position.set(xPos, 1.4, 0);
            group.add(bolt);

            // 3. The 4 Chains (Curved)
            const chainMat = new THREE.LineBasicMaterial({ color: 0x555555 });
            const beamPoint = new THREE.Vector3(xPos, 1.4, 0); // Connection point on beam
            
            // Lowered the connection point to touch the platter
            // Platter y=-0.5, height=0.1 -> Top surface is at -0.45
            const bakkieRimY = -0.45; 
            
            // 4 Connection points (The Corners of the Square)
            // Kept at +/- 0.5 so they are now "inside" the 1.2 sized platter
            const corners = [
                { x: 0.5, z: 0.5 },   // Front Right
                { x: -0.5, z: 0.5 },  // Front Left
                { x: -0.5, z: -0.5 }, // Back Left
                { x: 0.5, z: -0.5 }   // Back Right
            ];
            
            corners.forEach(corner => {
                const rimX = xPos + corner.x;
                const rimZ = corner.z;
                
                const start = beamPoint;
                const end = new THREE.Vector3(rimX, bakkieRimY, rimZ);
                
                // The "Laidback" Curve (Slack)
                const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
                mid.x += (rimX - xPos) * 0.2; // Push out slightly
                mid.y -= 0.2; // Sag down

                const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
                const points = curve.getPoints(20);
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, chainMat);
                group.add(line);
            });

            return group;
        }

        scene.add(createSuspendedBakkie(-1.5, 0x09a322)); // Green Left
        scene.add(createSuspendedBakkie(1.5, 0x972a2a));  // Red Right

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Gentle rotation to show 3D-ness
            // scene.rotation.y += 0.005;

            renderer.render(scene, camera);
        }
        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
